name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: true
      - name: テスト（合成画像・本物の写真・斜めの補正）
        run: pixi run test
      - name: 撮影条件の実験（悪い条件を1つずつ試す）
        run: pixi run python experiments/robustness.py
